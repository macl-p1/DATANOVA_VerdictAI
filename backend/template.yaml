AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VerdictAI backend

Parameters:
  CaseRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: >-
      Days a case record is kept before DynamoDB TTL removes it. These rows hold
      the accused's name, charges and arrest date, so they should not outlive
      their purpose.
  ConfidenceThreshold:
    Type: String
    Default: "0.90"
    Description: >-
      Minimum extraction confidence for any fact the rule engine relies on.
      Anything below this is flagged NEEDS_REVIEW rather than acted on.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 512
    Layers: [!Ref SharedLayer]
    Environment:
      Variables:
        CASES_TABLE: !Ref CasesTable
        STATUTES_TABLE: !Ref StatutesTable
        UPLOAD_BUCKET: !Ref UploadBucket
        CASE_RETENTION_DAYS: !Ref CaseRetentionDays
        CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold

Resources:

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: verdictai-shared
      ContentUri: shared/
      CompatibleRuntimes: [python3.13]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
        - AttributeName: flag
          AttributeType: S
        - AttributeName: daysOverdue
          AttributeType: N
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      # These rows hold personal legal data derived from the uploaded document.
      # The upload bucket expires after 7 days; without this the derived facts
      # were kept indefinitely.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: flag-daysOverdue-index
          KeySchema:
            - AttributeName: flag
              KeyType: HASH
            - AttributeName: daysOverdue
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  StatutesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/upload_url/
      Handler: app.lambda_handler
      Policies:
        - S3CrudPolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases/upload-url
            Method: POST

  TextractExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/textract_extract/
      Handler: app.lambda_handler
      # Must stay above the Textract polling budget in app.py (~2 minutes).
      Timeout: 300
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }
        - Statement:
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/extract/
      Handler: app.lambda_handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-1::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-west-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"

  RulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/rules/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref StatutesTable }

  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/explain/
      Handler: app.lambda_handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-1::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-west-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"

  WriteResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/write_result/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }

  # Eligibility under s.479 arrives with time served, so a flag computed once at
  # upload goes stale. This re-runs the engine daily over cases that can still
  # move, using the facts already stored (no re-extraction).
  ReevaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/reevaluate/
      Handler: app.lambda_handler
      Timeout: 300
      Environment:
        Variables:
          EXPLAIN_FUNCTION_NAME: !Ref ExplainFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }
        - DynamoDBReadPolicy: { TableName: !Ref StatutesTable }
        - LambdaInvokePolicy: { FunctionName: !Ref ExplainFunction }
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(30 1 * * ? *)
            Description: Re-evaluate open undertrial cases against today's date
            Enabled: true

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/query/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CasesTable }
      Events:
        GetAll:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases
            Method: GET
        GetOne:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases/{caseId}
            Method: GET

  BailDraftFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/bail_draft/
      Handler: app.lambda_handler
      Timeout: 120
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CasesTable }
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-1::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-west-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases/{caseId}/bail-draft
            Method: POST

  ProcessCaseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        Comment: "VerdictAI case processing pipeline"
        StartAt: RunTextract
        States:
          RunTextract:
            Type: Task
            Resource: !GetAtt TextractExtractFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunExtract

          RunExtract:
            Type: Task
            Resource: !GetAtt ExtractFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunRules

          RunRules:
            Type: Task
            Resource: !GetAtt RulesFunction.Arn
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunExplain

          RunExplain:
            Type: Task
            Resource: !GetAtt ExplainFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: WriteResult

          WriteResult:
            Type: Task
            Resource: !GetAtt WriteResultFunction.Arn
            End: true

          MarkFailed:
            Type: Task
            Resource: !GetAtt WriteResultFunction.Arn
            End: true

      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref TextractExtractFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref ExtractFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref RulesFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref ExplainFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref WriteResultFunction }

  EventBridgeStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ProcessCaseStateMachine

  UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: ["aws.s3"]
        detail-type: ["Object Created"]
        detail:
          bucket:
            name: [!Ref UploadBucket]
      Targets:
        - Arn: !Ref ProcessCaseStateMachine
          Id: StartProcessing
          RoleArn: !GetAtt EventBridgeStateMachineRole.Arn

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref ProcessCaseStateMachine