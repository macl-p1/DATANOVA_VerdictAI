AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VerdictAI backend

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 512
    Layers: [!Ref SharedLayer]
    Environment:
      Variables:
        CASES_TABLE: !Ref CasesTable
        STATUTES_TABLE: !Ref StatutesTable
        UPLOAD_BUCKET: !Ref UploadBucket

Resources:

  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: verdictai-shared
      ContentUri: shared/
      CompatibleRuntimes: [python3.13]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: caseId
          AttributeType: S
        - AttributeName: flag
          AttributeType: S
        - AttributeName: daysOverdue
          AttributeType: N
      KeySchema:
        - AttributeName: caseId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: flag-daysOverdue-index
          KeySchema:
            - AttributeName: flag
              KeyType: HASH
            - AttributeName: daysOverdue
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  StatutesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/upload_url/
      Handler: app.lambda_handler
      Policies:
        - S3CrudPolicy: { BucketName: !Ref UploadBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases/upload-url
            Method: POST

  TextractExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/textract_extract/
      Handler: app.lambda_handler
      Timeout: 60
      Policies:
        - S3ReadPolicy: { BucketName: !Ref UploadBucket }

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/extract/
      Handler: app.lambda_handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-1::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-west-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"

  RulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/rules/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref StatutesTable }

  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/explain/
      Handler: app.lambda_handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-1::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-east-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"
                - "arn:aws:bedrock:us-west-2::foundation-model/meta.llama4-maverick-17b-instruct-v1:0"

  WriteResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/write_result/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CasesTable }

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/query/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CasesTable }
      Events:
        GetAll:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases
            Method: GET
        GetOne:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /cases/{caseId}
            Method: GET

  ProcessCaseStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        Comment: "VerdictAI case processing pipeline"
        StartAt: RunTextract
        States:
          RunTextract:
            Type: Task
            Resource: !GetAtt TextractExtractFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunExtract

          RunExtract:
            Type: Task
            Resource: !GetAtt ExtractFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunRules

          RunRules:
            Type: Task
            Resource: !GetAtt RulesFunction.Arn
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: RunExplain

          RunExplain:
            Type: Task
            Resource: !GetAtt ExplainFunction.Arn
            Retry:
              - ErrorEquals: ["States.TaskFailed"]
                IntervalSeconds: 2
                MaxAttempts: 2
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: MarkFailed
            Next: WriteResult

          WriteResult:
            Type: Task
            Resource: !GetAtt WriteResultFunction.Arn
            End: true

          MarkFailed:
            Type: Task
            Resource: !GetAtt WriteResultFunction.Arn
            End: true

      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref TextractExtractFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref ExtractFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref RulesFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref ExplainFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref WriteResultFunction }

  EventBridgeStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ProcessCaseStateMachine

  UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: ["aws.s3"]
        detail-type: ["Object Created"]
        detail:
          bucket:
            name: [!Ref UploadBucket]
      Targets:
        - Arn: !Ref ProcessCaseStateMachine
          Id: StartProcessing
          RoleArn: !GetAtt EventBridgeStateMachineRole.Arn

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref ProcessCaseStateMachine